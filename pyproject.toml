[project]
name = "selforg"
version = "0.1.0"
description = "Self-org — система персональной организации"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<7",
    "celery[redis]>=5.4",
    "redis>=5",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "python-telegram-bot>=21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
